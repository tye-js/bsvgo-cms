name: Deploy BSVgo CMS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_VERSION: 11.4.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Pin npm
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Check deploy SSH config
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=0
          for name in SERVER_IP SERVER_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s\n' "$SSH_PRIVATE_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::SSH_PRIVATE_KEY must contain a private key, including BEGIN/END lines. Do not use the public .pub key here."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          APP_BRANCH: ${{ vars.APP_BRANCH || 'main' }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'bsvgo-cms' }}
          APP_PORT: ${{ vars.APP_PORT || '3100' }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          UPLOAD_DIR: ${{ vars.UPLOAD_DIR || '' }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL || '' }}
          MAX_UPLOAD_SIZE_MB: ${{ vars.MAX_UPLOAD_SIZE_MB || '' }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: APP_DIR,APP_BRANCH,PM2_APP_NAME,APP_PORT,GH_REPOSITORY,GH_TOKEN,DATABASE_URL,SESSION_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD,ADMIN_NAME,NEXT_PUBLIC_SITE_URL,UPLOAD_DIR,MEDIA_PUBLIC_BASE_URL,MAX_UPLOAD_SIZE_MB
          script: |
            set -euo pipefail

            if [ -z "${APP_DIR:-}" ]; then
              echo "APP_DIR secret is required"
              exit 1
            fi

            if [ -z "${GH_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN is required"
              exit 1
            fi

            if [ -z "${DATABASE_URL:-}" ] || [ -z "${SESSION_SECRET:-}" ] || [ -z "${ADMIN_PASSWORD:-}" ]; then
              echo "DATABASE_URL, SESSION_SECRET, and ADMIN_PASSWORD secrets are required"
              exit 1
            fi

            mkdir -p "$(dirname "$APP_DIR")"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone --branch "$APP_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" "$APP_DIR"
              git -C "$APP_DIR" remote set-url origin "https://github.com/${GH_REPOSITORY}.git"
            fi

            cd "$APP_DIR"

            cleanup_git_remote() {
              git remote set-url origin "https://github.com/${GH_REPOSITORY}.git" >/dev/null 2>&1 || true
            }
            trap cleanup_git_remote EXIT

            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
            git restore --source=HEAD -- next-env.d.ts
            git fetch origin "$APP_BRANCH"
            git checkout "$APP_BRANCH"
            git pull --ff-only origin "$APP_BRANCH"
            cleanup_git_remote

            if [ ! -f .env ]; then
              {
                printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
                printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
                printf 'ADMIN_EMAIL=%s\n' "${ADMIN_EMAIL:-admin@bsvgo.com}"
                printf 'ADMIN_PASSWORD=%s\n' "${ADMIN_PASSWORD:-}"
                printf 'ADMIN_NAME=%s\n' "${ADMIN_NAME:-BSVgo Admin}"
                if [ -n "${NEXT_PUBLIC_SITE_URL:-}" ]; then
                  printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$NEXT_PUBLIC_SITE_URL"
                fi
              } > .env
              chmod 600 .env
            fi

            set_env_var() {
              key="$1"
              value="$2"

              if [ -z "$value" ]; then
                return 0
              fi

              tmp_file="$(mktemp)"
              if grep -q "^${key}=" .env; then
                awk -v key="$key" -v value="$value" 'BEGIN { prefix = key "=" } index($0, prefix) == 1 { print prefix value; next } { print }' .env > "$tmp_file"
                cat "$tmp_file" > .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
              rm -f "$tmp_file"
            }

            set_env_var "UPLOAD_DIR" "${UPLOAD_DIR:-}"
            set_env_var "MEDIA_PUBLIC_BASE_URL" "${MEDIA_PUBLIC_BASE_URL:-}"
            set_env_var "MAX_UPLOAD_SIZE_MB" "${MAX_UPLOAD_SIZE_MB:-}"
            set_env_var "NEXT_PUBLIC_SITE_URL" "${NEXT_PUBLIC_SITE_URL:-}"
            chmod 600 .env

            node --version
            npm --version

            npm ci
            npm run db:migrate
            npm run build

            export PORT="$APP_PORT"
            export HOSTNAME="0.0.0.0"

            if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
              pm2 reload "$PM2_APP_NAME" --update-env
            else
              pm2 start npm --name "$PM2_APP_NAME" -- start
            fi

            pm2 save
