name: Deploy BSVgo CMS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_VERSION: 11.4.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Pin npm
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          APP_BRANCH: ${{ vars.APP_BRANCH || 'main' }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'bsvgo-cms' }}
          APP_PORT: ${{ vars.APP_PORT || '3100' }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NPM_VERSION: ${{ env.NPM_VERSION }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: APP_DIR,APP_BRANCH,PM2_APP_NAME,APP_PORT,GH_REPOSITORY,GH_TOKEN,NPM_VERSION
          script_stop: true
          script: |
            set -euo pipefail

            if [ -z "${APP_DIR:-}" ]; then
              echo "APP_DIR secret is required"
              exit 1
            fi

            if [ -z "${GH_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN is required"
              exit 1
            fi

            cd "$APP_DIR"

            cleanup_git_remote() {
              git remote set-url origin "https://github.com/${GH_REPOSITORY}.git" >/dev/null 2>&1 || true
            }
            trap cleanup_git_remote EXIT

            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
            git fetch origin "$APP_BRANCH"
            git checkout "$APP_BRANCH"
            git pull --ff-only origin "$APP_BRANCH"
            cleanup_git_remote

            npm install -g "npm@${NPM_VERSION}"
            node --version
            npm --version

            npm ci
            npm run db:migrate
            npm run build

            export PORT="$APP_PORT"
            export HOSTNAME="0.0.0.0"

            if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
              pm2 reload "$PM2_APP_NAME" --update-env
            else
              pm2 start npm --name "$PM2_APP_NAME" -- start
            fi

            pm2 save
